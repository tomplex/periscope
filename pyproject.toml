[project]
name = "periscope"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    # channel_server.py (sibling script) uses these via PEP-723; mirrored
    # here so the project venv resolves them for editor / LSP support.
    "mcp==1.27.*",
    "httpx",
    "websockets>=15,<17",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
]

[tool.pytest.ini_options]
testpaths = ["tests", "history/tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --strict-config"
