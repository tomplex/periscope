<!DOCTYPE html>
<html lang="en" data-density="compact" data-status-tx="current" data-border="leftbar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>periscope</title>
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="periscope-header">
    <div class="topbar">
      <span class="brand">periscope<i class="brand-cursor"></i></span>
      <div id="usage" class="usage"></div>
      <div class="meta">
        <span id="counts"></span>
        <span id="last-update"></span>
      </div>
    </div>
    <nav class="filters" id="filters">
      <a href="/history" class="filter-btn is-action" id="history-link" title="search conversation history (⌘/)">🔍 history <span class="ps-kbd" style="margin-left:4px">⌘</span><span class="ps-kbd">/</span></a>
      <span class="filters-sep"></span>
      <button data-filter="all" class="filter-btn active">all</button>
      <button data-filter="needs-input" class="filter-btn">needs input</button>
      <button data-filter="working" class="filter-btn">working</button>
      <button data-filter="done" class="filter-btn">done</button>
      <button data-filter="idle" class="filter-btn">idle</button>
      <button data-filter="claude" class="filter-btn">claude</button>
      <button data-filter="shell" class="filter-btn">shells</button>
      <button data-filter="ci-bad" class="filter-btn">CI ✗</button>
      <span class="filters-sep"></span>
      <button id="new-session" class="filter-btn is-action" title="create a new tmux session">+ session</button>
      <button id="toggle-all" class="filter-btn is-action" title="collapse or expand all sessions"></button>
      <button id="open-commands" class="filter-btn is-action" title="edit + claude / + shell / + ... commands">⚙</button>
      <span class="filters-spacer"></span>
      <div class="view-switch" id="view-switch" role="tablist" aria-label="view">
        <button class="view-switch-btn" data-view="grid" role="tab" aria-selected="true" title="grid view">▦ grid</button>
        <button class="view-switch-btn" data-view="stream" role="tab" aria-selected="false" title="stream view — tabs you've opened, by priority">≡ stream</button>
      </div>
    </nav>
  </header>
  <div id="commands-modal" class="hidden commands-modal-overlay">
    <div class="commands-modal-card">
      <header class="commands-modal-head">
        <h2>New-window commands</h2>
        <button id="commands-modal-close" title="close">×</button>
      </header>
      <p class="commands-modal-sub">First row is the primary button. Drag rows to reorder. Empty <code>exec</code> = bare shell.</p>
      <div id="commands-modal-list"></div>
      <button id="commands-modal-add" class="commands-modal-add">+ add command</button>
    </div>
  </div>
  <main id="grid"></main>
  <div id="modal" class="hidden">
    <div class="modal-card">
      <div class="modal-head">
        <div class="modal-title-block">
          <h2 id="modal-title"></h2>
          <div id="modal-subtitle" class="modal-subtitle"></div>
        </div>
        <div class="modal-actions">
          <button id="modal-auto-rename" title="ask Claude to rename this window">✨ rename</button>
          <button id="modal-close">×</button>
        </div>
      </div>
      <div class="modal-body">
        <div id="modal-xterm" class="modal-xterm"></div>
        <aside id="modal-side" class="modal-side"></aside>
      </div>
    </div>
  </div>
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
