<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>periscope</title>
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div class="header-row header-row-top">
      <h1>periscope</h1>
      <span id="usage" class="usage-pill" title=""></span>
      <div class="meta">
        <span id="counts"></span>
        <span id="last-update"></span>
      </div>
    </div>
    <div class="header-row header-row-bottom">
      <nav class="filters" id="filters">
        <button data-filter="all" class="active">all</button>
        <button data-filter="needs-input">needs input</button>
        <button data-filter="working">working</button>
        <button data-filter="waiting">waiting</button>
        <button data-filter="claude">claude</button>
        <button data-filter="shell">shells</button>
        <button data-filter="ci-bad">CI ✗</button>
      </nav>
      <div class="header-actions">
        <button id="new-session" class="header-action" title="create a new tmux session">+ session</button>
        <button id="toggle-all" class="header-action" title="collapse or expand all sessions"></button>
      </div>
    </div>
  </header>
  <main id="grid"></main>
  <div id="modal" class="hidden">
    <div class="modal-card">
      <div class="modal-head">
        <div class="modal-title-block">
          <h2 id="modal-title"></h2>
          <div id="modal-subtitle" class="modal-subtitle"></div>
        </div>
        <div class="modal-actions">
          <button id="modal-auto-rename" title="ask Claude to rename this window">✨ rename</button>
          <button id="modal-focus">focus in tmux</button>
          <button id="modal-close">×</button>
        </div>
      </div>
      <div id="modal-xterm" class="modal-xterm"></div>
    </div>
  </div>
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
