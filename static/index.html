<!DOCTYPE html>
<html lang="en" data-density="compact" data-status-tx="current" data-border="leftbar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#25282f">
  <title>periscope</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- Connection banner: shown by the poll loop on repeated /api/state
       failures. Read by src/grid/poll.js via getElementById; not rendered by
       any Preact component, so it lives here. -->
  <div id="connection-banner" hidden>
    <span>⚠ disconnected from periscope — retrying…</span>
  </div>

  <!-- Preact mount target. The entire dashboard (header, grid/split, modal,
       overlays) renders here via src/main.jsx. -->
  <div id="app"></div>

  <!-- Vendored xterm.js loads as plain scripts so Terminal/FitAddon land on
       window (the terminal core reads them off the global). -->
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script type="module" src="/dist/app.js"></script>
</body>
</html>
